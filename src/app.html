<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Bootstrap minified CSS downloaded from source, then unused CSS purged with PurgeCSS -->
		<link href="/bootstrap/bootstrap.min.css" rel="stylesheet">

		<!-- Fonts -->
		<link href='https://fonts.googleapis.com/css?family=Kablammo' rel='stylesheet'>
		<link href='https://fonts.googleapis.com/css?family=Inter' rel='stylesheet'>
		<link href='https://fonts.googleapis.com/css?family=Source Sans Pro' rel='stylesheet'>

		<!-- Icons -->
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<!-- Bootstrap minified JS including Popper downloaded from source -->
		<script src="/bootstrap/bootstrap.bundle.min.js"></script>
		<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
	</body>
</html>
